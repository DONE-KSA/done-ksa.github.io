<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8914A"/><stop offset="1" stop-color="#9E7535"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2C285"/><stop offset="1" stop-color="#B88B45"/></linearGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#A8803C" stroke-opacity=".07"/></pattern>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6DED0"/></linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <circle cx="360" cy="10" r="120" fill="#C8A15A" opacity=".1"/>
  <!-- tablet -->
  <rect x="78" y="24" width="244" height="192" rx="18" fill="#B8914A" stroke="#C9A45C" stroke-width="2"/>
  <rect x="90" y="36" width="220" height="168" rx="9" fill="#F8F6F1"/>
  <rect x="90" y="36" width="220" height="168" rx="9" fill="url(#grid)"/>
  <!-- isometric room -->
  <path d="M200 182 290 134 200 88 110 134Z" fill="#E4D8C4"/>
  <g stroke="#C9B99E" stroke-width="1" opacity=".8">
    <path d="M222.5 170 132.5 122M245 158 155 110M267.5 146 177.5 98M177.5 170 267.5 122M155 158 245 110M132.5 146 222.5 98"/>
  </g>
  <path d="M110 134 200 88V44L110 90Z" fill="#F1EBE0"/>
  <path d="M200 88 290 134V90L200 44Z" fill="#E7DFD1"/>
  <!-- kitchen block on right wall -->
  <path d="M222 112 266 135 250 143 206 120Z" fill="url(#marble)" stroke="#C8A15A" stroke-width="1"/>
  <path d="M206 120 250 143V160L206 137Z" fill="#B8914A"/>
  <path d="M250 143 266 135V152L250 160Z" fill="#A8803C"/>
  <path d="M228 117l8 4M238 122l8 4" stroke="#B88B45" stroke-width="2" stroke-linecap="round"/>
  <!-- upper cabinets -->
  <path d="M222 70 266 93V108L222 85Z" fill="#E9DFCC"/>
  <!-- island/table -->
  <path d="M150 140 182 157 166 165 134 148Z" fill="url(#gold)"/>
  <path d="M134 148 166 165V172L134 155Z" fill="#9C7438"/>
  <!-- window on left wall -->
  <path d="M135 104 165 88V64L135 80Z" fill="#CFE2EB" stroke="#B9AE9C" stroke-width="1.5"/>
  <!-- approved badge -->
  <circle cx="284" cy="60" r="14" fill="#1E9E6A"/>
  <path d="M277 60.5l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- swatches -->
  <g transform="translate(100 182)">
    <rect width="14" height="14" rx="4" fill="url(#marble)" stroke="#D6CCBB"/><rect x="18" width="14" height="14" rx="4" fill="#B8914A"/><rect x="36" width="14" height="14" rx="4" fill="url(#gold)"/>
  </g>
  <!-- stylus -->
  <g transform="rotate(38 340 150)"><rect x="300" y="146" width="96" height="9" rx="4.5" fill="url(#gold)"/><path d="M300 146l-14 4.5 14 4.5z" fill="#F4EFE6"/></g>
  <!-- color swatch fan -->
  <g transform="translate(26 150)">
    <rect width="40" height="64" rx="6" fill="#F4EFE6" transform="rotate(-18 20 64)"/>
    <rect width="40" height="64" rx="6" fill="#C8A15A" transform="rotate(-6 20 64)"/>
    <rect width="40" height="64" rx="6" fill="#B07A4A" transform="rotate(6 20 64)"/>
  </g>
</svg>
