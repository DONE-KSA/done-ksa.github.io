<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#ECE5D9"/><stop offset="1" stop-color="#F7F2EA"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2C285"/><stop offset="1" stop-color="#B88B45"/></linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3EDF1"/><stop offset="1" stop-color="#C5D7DF"/></linearGradient>
    <radialGradient id="bowl" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCD3C4"/></radialGradient>
  </defs>
  <rect width="400" height="240" fill="#E9DFCC"/>
  <!-- vertical porcelain wall slabs -->
  <g fill="#F2EADC"><rect x="0" width="78" height="240"/><rect x="160" width="80" height="240"/><rect x="322" width="78" height="240"/></g>
  <path d="M20 0q30 60 10 120M190 30q20 40-10 90M350 10q-20 50 10 110" stroke="#D9CBB0" stroke-width="2" fill="none"/>
  <!-- mirror -->
  <rect x="132" y="18" width="136" height="96" rx="48" fill="url(#mirror)" stroke="url(#gold)" stroke-width="4"/>
  <path d="M160 96 196 30M178 102 208 46" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <!-- wall lights -->
  <rect x="104" y="40" width="10" height="44" rx="5" fill="url(#gold)"/><rect x="286" y="40" width="10" height="44" rx="5" fill="url(#gold)"/>
  <circle cx="109" cy="62" r="22" fill="#F5D99E" opacity=".12"/><circle cx="291" cy="62" r="22" fill="#F5D99E" opacity=".12"/>
  <!-- faucet -->
  <path d="M200 146v-16a8 8 0 0 1 8-8h14v6" stroke="url(#gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="194" y="142" width="12" height="8" rx="2" fill="url(#gold)"/>
  <!-- vessel basin -->
  <path d="M164 132h72a36 22 0 0 1-72 0z" fill="url(#bowl)" transform="translate(0 0)"/>
  <ellipse cx="200" cy="132" rx="36" ry="6" fill="#fff" stroke="#D3C9B8"/>
  <!-- marble countertop -->
  <rect x="70" y="150" width="260" height="20" rx="3" fill="url(#marble)"/>
  <path d="M84 156q40 10 80 2M210 162q50-10 100 4M260 154q20 4 40 0" stroke="#BFB29D" stroke-width="1.3" fill="none"/>
  <path d="M120 164q30-6 50 2" stroke="#C8A15A" stroke-width="1" fill="none" opacity=".7"/>
  <!-- vanity cabinet -->
  <rect x="84" y="170" width="232" height="58" rx="2" fill="#A8803C"/>
  <path d="M200 170v58" stroke="#B8914A" stroke-width="2"/>
  <rect x="160" y="190" width="30" height="4" rx="2" fill="url(#gold)"/><rect x="210" y="190" width="30" height="4" rx="2" fill="url(#gold)"/>
  <rect x="70" y="228" width="260" height="12" fill="#B8914A"/>
  <!-- towel & vase -->
  <rect x="96" y="134" width="40" height="16" rx="3" fill="#F4EFE6"/>
  <path d="M290 150c-6-10-4-22 4-26 8 4 10 16 4 26z" fill="#C8A15A"/>
  <path d="M294 124c-2-12 4-22 12-26M294 124c0-10-6-18-14-20" stroke="#6E9A7A" stroke-width="2" fill="none"/>
</svg>
