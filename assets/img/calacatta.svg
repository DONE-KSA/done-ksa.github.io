<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Calacatta Gold porcelain slab: warm white base, soft grey clouds, grey + gold veins -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset=".45" stop-color="#FAF7F1"/>
      <stop offset="1" stop-color="#FDFBF7"/>
    </linearGradient>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0035" numOctaves="4" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.62  0 0 0 0 0.56  1.6 0 0 0 -0.78"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.011" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.8"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" filter="url(#cloud)" opacity=".28"/>

  <!-- broad soft grey veins -->
  <g filter="url(#soft)" fill="none" stroke="#A39B8E" stroke-linecap="round" opacity=".22">
    <path d="M-100 180 C 300 260, 520 420, 820 470 S 1300 640, 1700 760" stroke-width="46"/>
    <path d="M-80 720 C 300 650, 600 770, 900 830 S 1300 900, 1680 1060" stroke-width="34"/>
    <path d="M880 -60 C 1000 150, 1220 250, 1680 300" stroke-width="26"/>
  </g>

  <!-- gold veins -->
  <g filter="url(#warp)" fill="none" stroke-linecap="round">
    <path d="M-100 190 C 300 270, 520 430, 820 478 S 1300 650, 1700 770" stroke="#C9A45C" stroke-width="5" opacity=".75"/>
    <path d="M-100 196 C 300 278, 520 436, 820 486 S 1300 656, 1700 780" stroke="#B8914A" stroke-width="1.6" opacity=".6"/>
    <path d="M-80 730 C 300 660, 600 780, 900 840 S 1300 910, 1680 1070" stroke="#C9A45C" stroke-width="3.5" opacity=".65"/>
    <path d="M520 430 C 560 520, 640 610, 700 720 S 760 900, 820 1040" stroke="#D2B06A" stroke-width="2.2" opacity=".6"/>
    <path d="M1100 575 C 1160 490, 1260 440, 1420 425 S 1600 380, 1700 330" stroke="#C9A45C" stroke-width="2.4" opacity=".55"/>
  </g>

  <!-- fine grey veins -->
  <g filter="url(#warp)" fill="none" stroke="#8E877B" stroke-linecap="round">
    <path d="M200 -50 C 380 200, 640 330, 900 380 S 1350 520, 1700 470" stroke-width="1.4" opacity=".45"/>
    <path d="M880 -60 C 1000 150, 1220 255, 1680 305" stroke-width="1.8" opacity=".5"/>
    <path d="M-60 460 C 180 480, 320 560, 520 600 S 820 640, 980 720" stroke-width="1" opacity=".35"/>
    <path d="M300 900 C 420 820, 520 800, 700 820" stroke-width="1" opacity=".35"/>
    <path d="M1250 -40 C 1300 100, 1420 160, 1650 170" stroke-width="1" opacity=".35"/>
    <path d="M1180 1040 C 1260 900, 1380 860, 1680 860" stroke-width="1.2" opacity=".4"/>
  </g>
</svg>
